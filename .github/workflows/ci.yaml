name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  macOS:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install (mise)
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: false

      - name: Trust
        run: |
          mise trust
          mise trust dotfiles/config/mise/config.toml

      - name: Plan
        run: mise bootstrap plan

      # Everything except the parts that would install software onto the
      # runner. `--dry-run` still runs `[tasks.bootstrap]`, hence `--skip
      # task`.
      - name: Dry run
        run: mise bootstrap --dry-run --yes --skip packages,tools,task
