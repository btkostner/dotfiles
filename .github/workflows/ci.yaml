name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macOS:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install (mise)
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          cache: true

      - name: Trust
        run: |
          mise trust
          mise trust dotfiles/config/mise/config.toml

      - name: Lint
        run: mise exec -- hk check --all

      - name: Plan
        run: mise bootstrap plan

      # Everything except the parts that would install software onto the
      # runner. `--dry-run` still runs `[tasks.bootstrap]`, hence `--skip
      # task`.
      - name: Dry run
        run: mise bootstrap --dry-run --yes --skip packages,tools,task
