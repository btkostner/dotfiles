# Secret inputs for `mise bootstrap`. The matching declarations live in
# [bootstrap.secrets] in mise.toml; this file says where the values come from.
#
# Nothing is declared right now — the Zed GitHub PAT was the only one, and the
# MCP server that needed it is gone. The provider below is kept so the next
# secret is one line in each file rather than a rebuild.
#
# Nothing secret is stored here — only 1Password references — so it is safe to
# commit. Give every secret an empty default and `if_missing = "warn"`, paired
# with `allow_empty` on the mise side: a machine with no 1Password, or with
# `op` not signed in, then still finishes its bootstrap instead of failing.
#
#   fnox exec -- mise bootstrap
#
# The nushell config activates fnox per-directory, so an interactive shell
# already has them.

[providers.onepassword]
type = "1password"
vault = "Private"

[secrets]
