# Machine bootstrap for btkostner.
#
# Everything this repo does is declared here. Run it with:
#
#   mise trust && mise bootstrap
#
# Preview without touching anything:
#
#   mise bootstrap plan
#   mise bootstrap --dry-run
#
# See https://mise.jdx.dev/bootstrap.html

min_version = "2026.9.8"

[settings.dotfiles]
default_mode = "symlink"

# ---------------------------------------------------------------------------
# Packages
#
# Installed before dotfiles are applied, so the binaries the templates resolve
# by absolute path already exist by the time they are rendered.
# ---------------------------------------------------------------------------

[bootstrap.packages]
"brew:curl" = { version = "latest", os = "macos" }
"apt:curl" = { version = "latest", os = "linux" }

"brew:gnupg" = { version = "latest", os = "macos" }
"apt:gnupg" = { version = "latest", os = "linux" }

"brew:zoxide" = { version = "latest", os = "macos" }
"apt:zoxide" = { version = "latest", os = "linux" }

# Called by nushell's gh-npm.nu at every shell start. Ubuntu carries an old
# gh in universe; the hook adds GitHub's own repository for a current one.
"brew:gh" = { version = "latest", os = "macos" }
"apt:gh" = { version = "latest", os = "linux" }

# The patched Nerd Font is not packaged for apt. Plain FiraCode is the closest
# thing there — fine here, since the starship config below uses text symbols
# rather than glyphs.
"brew-cask:font-fira-code-nerd-font" = { version = "latest", os = "macos" }
"apt:fonts-firacode" = { version = "latest", os = "linux" }
# Ghostty's cask repackages the official macOS binary from the Ghostty project.
"brew-cask:ghostty" = { version = "latest", os = "macos" }

# These three come from third-party apt repositories that the pre-packages
# hook below adds first. starship is not here: it has no apt repository
# outside Debian 13+, and a missing apt package is a hard error.
"brew:nushell" = { version = "latest", os = "macos" }
"apt:nushell" = { version = "latest", os = "linux" }

"brew-cask:1password-cli" = { version = "latest", os = "macos" }
"apt:1password-cli" = { version = "latest", os = "linux" }

# mise is deliberately absent from this list. It installs itself from
# https://mise.run and stays out of any package manager, which is what keeps
# `auto_update` in the global config working — Homebrew builds disable
# self-update. See the README for moving an existing brew install across.

# Tapped casks are deliberately not declared here. mise resolves cask metadata
# from formulae.brew.sh, which only knows homebrew-core, and falls back to
# evaluating the tap's Casks/*.rb — which needs Ruby 3, while macOS ships 2.6.
# That failure takes down `mise bootstrap plan` entirely, so `entire` stays a
# plain `brew install` like docker-desktop. See the README.

# ---------------------------------------------------------------------------
# Hooks
# ---------------------------------------------------------------------------

# apt has no nushell, no current gh, and no 1Password at all, so the repos for
# them get added before [bootstrap.packages] runs. Needs sudo on Linux; a
# no-op everywhere else. --dry-run prints this rather than running it.
[bootstrap.hooks.pre-packages]
run = "sh scripts/linux-repos.sh"

# Two things that both have to happen before anything is written into
# ~/.config. Installing nushell seeds stub config.nu/env.nu files right where
# the dotfiles phase wants to write, which would otherwise stop the run dead.
# And omp is the binary the Zed settings name by absolute path, so it goes in
# ahead of them rather than a phase later.
[bootstrap.hooks.pre-dotfiles]
run = ["sh scripts/clear-nushell-stubs.sh", "sh scripts/install-omp.sh"]

# [bootstrap.user].login_shell below wants one absolute path that works on
# every machine; nushell does not have one. This keeps /usr/local/bin/nu
# pointing at whichever install is real.
[bootstrap.hooks.pre-user]
run = "sh scripts/register-shell.sh"

# Dock and Finder read their preferences at launch, so a tile list or an
# autohide change does nothing visible until they are restarted.
[bootstrap.hooks.post-defaults]
run = "killall Dock || true"

# ---------------------------------------------------------------------------
# Directories
# ---------------------------------------------------------------------------

[bootstrap.directories."~/.ssh"]
state = "present"
mode = "0700"

# Both are listed in trusted_config_paths in the global mise config, and the
# hiivemarkets one holds the work .gitconfig that ~/.gitconfig includes.
[bootstrap.directories."~/Projects/github.com/btkostner"]
state = "present"

[bootstrap.directories."~/Projects/github.com/hiivemarkets"]
state = "present"

# ---------------------------------------------------------------------------
# Files that should not exist
#
# Nushell is the shell here, so the bash/zsh leftovers get cleaned up.
# ---------------------------------------------------------------------------

[bootstrap.files."~/.bash_history"]
state = "absent"

[bootstrap.files."~/.bashrc"]
state = "absent"

[bootstrap.files."~/.tool-versions"]
state = "absent"

[bootstrap.files."~/.zcompdump"]
state = "absent"

[bootstrap.files."~/.zprofile"]
state = "absent"

[bootstrap.files."~/.zsh_history"]
state = "absent"

[bootstrap.files."~/.zshrc"]
state = "absent"

# The only one of these that is a directory, and zsh keeps per-session history
# files in it, so it is never empty by the time bootstrap gets here. `absent`
# on its own stops at ENOTEMPTY ("Directory not empty (os error 66)") and
# fails the whole run; mise wants `recursive` to delete a directory that has
# contents, and shows it as destructive in the plan.
[bootstrap.directories."~/.zsh_sessions"]
state = "absent"
recursive = true

# ---------------------------------------------------------------------------
# Repos
# ---------------------------------------------------------------------------

[bootstrap.repos."~/.config/nvim"]
url = "https://github.com/AstroNvim/AstroNvim.git"

# ---------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------

# GUI apps do not read the shell environment, so the XDG base directories are
# published to the launchd session at login. Installed as
# `dev.mise.setXDG`; mise namespaces every agent label it writes.
[bootstrap.macos.launchd.agents.setXDG]
program = "/bin/sh"
args = ["-c", '''
  launchctl setenv XDG_CACHE_HOME "$HOME/.cache"
  launchctl setenv XDG_CONFIG_HOME "$HOME/.config"
  launchctl setenv XDG_DATA_HOME "$HOME/.local/share"
  launchctl setenv XDG_STATE_HOME "$HOME/.local/state"
  ''']
run_at_load = true
keep_alive = false

# ---------------------------------------------------------------------------
# User
# ---------------------------------------------------------------------------

# mise appends this to /etc/shells before running chsh, so it does not have to
# be registered first. The path is the symlink the pre-user hook maintains,
# because Homebrew and apt install nushell to different places.
[bootstrap.user]
login_shell = "/usr/local/bin/nu"

# ---------------------------------------------------------------------------
# macOS preferences
#
# Read off this machine rather than invented: with the Dock tile list aside,
# these are the settings that actually differ from Apple's defaults. Anything
# absent is left at whatever the OS ships.
# ---------------------------------------------------------------------------

[bootstrap.macos.dock]
autohide = true
show_recents = false
apps = [
  "/Applications/Zen.app",
  "/System/Applications/Messages.app",
  "/System/Applications/Mail.app",
  "/System/Applications/Calendar.app",
  "/System/Applications/Reminders.app",
  "/System/Applications/Notes.app",
  "/System/Applications/Music.app",
  "/Applications/Zed.app",
  "/System/Applications/App Store.app",
  "/System/Applications/Campo.app",
  "/System/Applications/System Settings.app",
]

[bootstrap.macos.keyboard]
automatic_capitalization = true
automatic_spelling_correction = false

[bootstrap.macos.trackpad]
tap_to_click = false
three_finger_drag = false

# Dark mode has no curated section, so it goes in as a raw default.
[bootstrap.macos.defaults.NSGlobalDomain]
AppleInterfaceStyle = "Dark"

# ---------------------------------------------------------------------------
# Dotfiles
#
# Sources are relative to this file. Symlinked by default, so editing the live
# file edits the file in this repo.
# ---------------------------------------------------------------------------

[dotfiles]
"~/.editorconfig" = "dotfiles/editorconfig"
"~/.gitconfig" = "dotfiles/gitconfig"
"~/.config/ghostty/config" = "dotfiles/config/ghostty/config"
"~/.config/starship.toml" = "dotfiles/config/starship.toml"
"~/.config/mise/config.toml" = "dotfiles/config/mise/config.toml"

# Only omp's settings file is linked. The sibling databases and sessions hold
# credentials or high-churn runtime state and must stay out of this repo.
"~/.omp/agent/config.yml" = "dotfiles/omp/agent/config.yml"

# Both plain links now that nothing in the settings is rendered. Zed rewrites
# settings.json itself whenever a preference is changed in its UI, and a link
# means those edits land in this repo rather than being overwritten on the
# next apply. Switch to mode = "copy" if that turns out to be unwanted.
"~/.config/zed/settings.json" = "dotfiles/config/zed/settings.json"

# Zed has no setting that picks a default agent, so this rebinds the agent
# panel's new-thread key to omp. See the README.
"~/.config/zed/keymap.json" = "dotfiles/config/zed/keymap.json"

# Linked file by file: nushell writes history and plugin state into this
# directory and that should not land in this repo. Templates are excluded here
# and deployed individually below.
[dotfiles."~/.config/nushell"]
source = "dotfiles/config/nushell"
mode = "symlink-each"
exclude = ["*.tmpl"]

# ---------------------------------------------------------------------------
# Templated dotfiles
#
# Rendered, not linked, because they bake in an absolute path or branch on the
# OS. Editing the deployed copy does not edit this repo — edit the .tmpl and
# re-apply. `uname` picks the branch; binary paths are resolved once at apply
# time so the shell never pays for a PATH lookup at prompt time.
# ---------------------------------------------------------------------------

[dotfiles."~/.ssh/config"]
source = "dotfiles/ssh/config.tmpl"
mode = "template"

# 1Password's commit signer lives in a different place on each OS.
[dotfiles."~/Projects/github.com/hiivemarkets/.gitconfig"]
source = "dotfiles/projects/hiivemarkets/gitconfig.tmpl"
mode = "template"

[dotfiles."~/.config/nushell/env.nu"]
source = "dotfiles/config/nushell/env.nu.tmpl"
mode = "template"

[dotfiles."~/.config/nushell/scripts/mise.nu"]
source = "dotfiles/config/nushell/scripts/mise.nu.tmpl"
mode = "template"

[dotfiles."~/.config/nushell/scripts/starship.nu"]
source = "dotfiles/config/nushell/scripts/starship.nu.tmpl"
mode = "template"

[dotfiles."~/.config/nushell/scripts/gh-npm.nu"]
source = "dotfiles/config/nushell/scripts/gh-npm.nu.tmpl"
mode = "template"

# ---------------------------------------------------------------------------
# Final task
# ---------------------------------------------------------------------------

# ~/.config/mise/config.toml is itself a dotfile, so on a fresh machine the
# global toolchain it declares is only visible to mise after this run linked
# it. A fresh `mise install` picks it up in the same pass.
[tasks.bootstrap]
description = "Install the global toolchain and wire up this repo's git hooks"
run = [
  "mise install",
  # The history watcher is declared in the global config, which this run only
  # just linked — the services phase ran before that existed.
  "mise bootstrap services apply --yes",
  # Config-based hooks on git 2.54+, so .git/hooks stays empty. Repo-local on
  # purpose: `hk install --global` would edit ~/.gitconfig, which this repo
  # tracks, and turn hk on for every repo on the machine.
  "hk install",
]

# The two subscription logins omp routes through. Both open a browser and are
# answered by hand, which is why they are a task rather than part of the
# bootstrap run. Equivalent to `/login anthropic` and `/login openai-codex`
# inside a session; `omp usage` lists what is signed in.
[tasks.omp-login]
description = "Sign omp in to the Claude and Codex subscriptions"
run = ["omp auth-broker login anthropic", "omp auth-broker login openai-codex"]

# Linters for this repo, run by hk. `uv` is not used directly: yamllint is a
# pypi package, and without uv (or pipx) mise cannot install it on a machine
# that has no Python. mise sequences the two on its own.
[tools]
actionlint = "1.7.12"
editorconfig-checker = "3.4.0"
gitleaks = "8.30.1"
hk = "2.0.0"
lychee = "0.24.2"
pinact = "5.0.0"
pkl = "0.32.1"
rumdl = "0.2.73"
shellcheck = "0.11.0"
shfmt = "3.14.1"
taplo = "0.10.0"
typos = "1.50.1"
uv = "0.12.13"
yamlfmt = "0.21.0"
yamllint = "1.38.0"
zizmor = "1.30.1"
