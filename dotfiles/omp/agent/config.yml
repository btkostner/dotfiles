providers:
  anthropic:
    serverSideFallback: true
  cloudflare:
    base_url: https://ai-gateway.hiive.network
  tinyModelDevice: mlx
  tinyModelDtype: default
modelRoles:
  tiny: local/lfm2.5-230m
  memory: local/lfm2-1.2b
  smol: openai-codex/gpt-6-luna
  advisor: openai-codex/gpt-6.1-sol:auto
  default: openai-codex/gpt-6.1-sol
symbolPreset: nerd
composer:
  shape: pi
theme:
  dark: dark-one
  light: light-one
setupVersion: 3
terminal:
  showProgress: true
tui:
  renderMermaid: true
display:
  showTokenUsage: true
  showTurnTime: true
  cacheMissMarker: false
tier:
  openai: none
  anthropic: none
personality: pragmatic
retry:
  waitForUsageReset: true
  usageAwareFallback: true
  fallbackRevertPolicy: cooldown-expiry
advisor:
  enabled: false
  syncBacklog: "1"
  immuneTurns: 2
  maxNotesPerUpdate: 4
prewalk:
  enabled: false
error:
  notify: "off"
startup:
  quiet: true
marketplace:
  autoUpdate: auto
power:
  sleepPrevention: idle
features:
  unexpectedStopDetection: smart
compaction:
  experimentalContextManagement: true
  handoffSaveToDisk: true
  idleEnabled: true
memory:
  backend: mnemopi
autolearn:
  enabled: true
  autoContinue: true
mnemopi:
  scoping: per-project-tagged
  enhancedRecall: true
  proactiveLinking: true
  polyphonicRecall: true
  llmMode: smol
eval:
  autoBackground:
    enabled: true
plan:
  autosave: false
task:
  eager: preferred
  enableEffort: true
  maxEffort: high
  prewalk: true
  isolation:
    commits: generic
dev:
  autoqaConsent: denied
defaultThinkingLevel: auto
inlineToolDescriptors: auto
autoResume: true
update:
  auto: true
